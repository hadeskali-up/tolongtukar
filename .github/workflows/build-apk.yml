name: Build TolongTukar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests and Build Debug APK
        run: ./gradlew :composeApp:allTests :composeApp:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tolongtukar-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload APK to temp.sh
        id: upload
        run: |
          APK_PATH=$(ls composeApp/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          echo "APK found at: $APK_PATH"
          if [ -n "$APK_PATH" ]; then
            echo "Uploading to temp.sh..."
            RESPONSE=$(curl -s -F "file=@$APK_PATH" https://temp.sh/upload)
            echo "temp.sh response: $RESPONSE"
            echo "download_url=$RESPONSE" >> $GITHUB_OUTPUT
          else
            echo "No APK found at expected path"
            ALT_APK=$(find . -name "*.apk" -path "*/outputs/apk/*" 2>/dev/null | head -1)
            echo "Trying alternate path: $ALT_APK"
            if [ -n "$ALT_APK" ]; then
              RESPONSE=$(curl -s -F "file=@$ALT_APK" https://temp.sh/upload)
              echo "temp.sh response: $RESPONSE"
              echo "download_url=$RESPONSE" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Print Download URL
        run: |
          echo "================================="
          echo "📱 TolongTukar APK Download URL:"
          echo "${{ steps.upload.outputs.download_url }}"
          echo "================================="
