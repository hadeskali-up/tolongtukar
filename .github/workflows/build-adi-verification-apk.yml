name: Build TolongTukar ADI Verification APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adi-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOLONGTUKAR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tolongtukar-upload.jks"
          test -s "$RUNNER_TEMP/tolongtukar-upload.jks"

      - name: Verify upload keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOLONGTUKAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOLONGTUKAR_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list -keystore "$RUNNER_TEMP/tolongtukar-upload.jks" \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Test and build signed release APK
        env:
          TOLONGTUKAR_KEYSTORE_PATH: ${{ runner.temp }}/tolongtukar-upload.jks
          TOLONGTUKAR_KEYSTORE_PASSWORD: ${{ secrets.TOLONGTUKAR_KEYSTORE_PASSWORD }}
          TOLONGTUKAR_KEY_ALIAS: ${{ secrets.TOLONGTUKAR_KEY_ALIAS }}
          TOLONGTUKAR_KEY_PASSWORD: ${{ secrets.TOLONGTUKAR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:allTests :composeApp:assembleRelease

      - name: Verify APK and ADI registration asset
        shell: bash
        run: |
          set -euo pipefail
          APK="composeApp/build/outputs/apk/release/composeApp-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F 'assets/adi-registration.properties'
          unzip -p "$APK" assets/adi-registration.properties | grep -Fx 'CPJ5ZXKTXHNXQAAAAAAAAAAAAA'
          jarsigner -verify -verbose -certs "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          stat --printf='APK_SIZE_BYTES=%s\n' "$APK"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tolongtukar-adi-verification-apk
          path: |
            composeApp/build/outputs/apk/release/composeApp-release.apk
            composeApp/build/outputs/apk/release/composeApp-release.apk.sha256
          if-no-files-found: error
          retention-days: 30