name: Build TolongTukar Release AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOLONGTUKAR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tolongtukar-upload.jks"
          test -s "$RUNNER_TEMP/tolongtukar-upload.jks"

      - name: Test and build signed release bundle
        env:
          TOLONGTUKAR_KEYSTORE_PATH: ${{ runner.temp }}/tolongtukar-upload.jks
          TOLONGTUKAR_KEYSTORE_PASSWORD: ${{ secrets.TOLONGTUKAR_KEYSTORE_PASSWORD }}
          TOLONGTUKAR_KEY_ALIAS: ${{ secrets.TOLONGTUKAR_KEY_ALIAS }}
          TOLONGTUKAR_KEY_PASSWORD: ${{ secrets.TOLONGTUKAR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:allTests :composeApp:bundleRelease

      - name: Verify release bundle
        shell: bash
        run: |
          set -euo pipefail
          AAB="composeApp/build/outputs/bundle/release/composeApp-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB"
          sha256sum "$AAB" | tee "$AAB.sha256"
          stat --printf='AAB_SIZE_BYTES=%s\n' "$AAB"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: tolongtukar-release-aab
          path: |
            composeApp/build/outputs/bundle/release/composeApp-release.aab
            composeApp/build/outputs/bundle/release/composeApp-release.aab.sha256
          if-no-files-found: error
          retention-days: 30